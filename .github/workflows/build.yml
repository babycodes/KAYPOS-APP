name: Cross-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            build_cmd: flutter build apk --release
            asset_path: frontend/build/app/outputs/flutter-apk/app-release.apk
            asset_name: KAYPOS-Android.apk
          - os: ubuntu-latest
            target: linux
            build_cmd: flutter build linux --release
            asset_name: KAYPOS-Linux
          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            asset_path: frontend/build/windows/x64/runner/Release/
            asset_name: KAYPOS-Windows.zip
          - os: macos-latest
            target: macos
            build_cmd: flutter build macos --release
            asset_name: KAYPOS-MacOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (for Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config ninja-build libgtk-3-dev ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Application
        working-directory: frontend
        run: ${{ matrix.build_cmd }}

      - name: Compress MacOS App
        if: matrix.target == 'macos'
        working-directory: frontend/build/macos/Build/Products/Release
        run: zip -r KAYPOS-MacOS.zip Kaypos.app

      - name: Compress Windows App
        if: matrix.target == 'windows'
        working-directory: frontend/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath KAYPOS-Windows.zip

      - name: Package Linux App (DEB & RPM)
        if: matrix.target == 'linux'
        working-directory: frontend
        run: |
          mkdir -p package_root/opt/kaypos
          cp -r build/linux/x64/release/bundle/* package_root/opt/kaypos/
          
          mkdir -p package_root/usr/share/applications
          cat <<EOF > package_root/usr/share/applications/kaypos.desktop
          [Desktop Entry]
          Version=1.0
          Name=Kaypos
          GenericName=Point of Sale
          Comment=A modern Point of Sale application
          Exec=/opt/kaypos/kaypos
          Icon=kaypos
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          mkdir -p package_root/usr/share/icons/hicolor/512x512/apps
          cp assets/icon-512.png package_root/usr/share/icons/hicolor/512x512/apps/kaypos.png
          
          fpm -s dir -t deb -n kaypos -v 1.0.0 -C package_root .
          fpm -s dir -t rpm -n kaypos -v 1.0.0 -C package_root .
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.target == 'macos' && 'frontend/build/macos/Build/Products/Release/KAYPOS-MacOS.zip' || '' }}
            ${{ matrix.target == 'windows' && 'frontend/build/windows/x64/runner/Release/KAYPOS-Windows.zip' || '' }}
            ${{ matrix.target == 'linux' && 'frontend/kaypos*.deb' || '' }}
            ${{ matrix.target == 'linux' && 'frontend/kaypos*.rpm' || '' }}
            ${{ matrix.target == 'android' && 'frontend/build/app/outputs/flutter-apk/app-release.apk' || '' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0-latest' }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
