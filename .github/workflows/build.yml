name: Cross-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            build_cmd: flutter build apk --release
            asset_path: frontend/build/app/outputs/flutter-apk/app-release.apk
            asset_name: KAYPOS-Android.apk
          - os: ubuntu-latest
            target: linux
            build_cmd: flutter build linux --release
            asset_path: frontend/build/linux/x64/release/bundle/
            asset_name: KAYPOS-Linux.tar.gz
          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            asset_path: frontend/build/windows/x64/runner/Release/
            asset_name: KAYPOS-Windows.zip
          - os: macos-latest
            target: macos
            build_cmd: flutter build macos --release
            asset_path: frontend/build/macos/Build/Products/Release/KAYPOS.app/
            asset_name: KAYPOS-MacOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (for Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Application
        working-directory: frontend
        run: ${{ matrix.build_cmd }}

      - name: Compress MacOS App
        if: matrix.target == 'macos'
        working-directory: frontend/build/macos/Build/Products/Release
        run: zip -r KAYPOS-MacOS.zip KAYPOS.app

      - name: Compress Windows App
        if: matrix.target == 'windows'
        working-directory: frontend/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath KAYPOS-Windows.zip

      - name: Compress Linux App
        if: matrix.target == 'linux'
        working-directory: frontend/build/linux/x64/release/bundle
        run: tar -czvf KAYPOS-Linux.tar.gz *

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ matrix.target == 'macos' && 'frontend/build/macos/Build/Products/Release/KAYPOS-MacOS.zip' || '' }}
            ${{ matrix.target == 'windows' && 'frontend/build/windows/x64/runner/Release/KAYPOS-Windows.zip' || '' }}
            ${{ matrix.target == 'linux' && 'frontend/build/linux/x64/release/bundle/KAYPOS-Linux.tar.gz' || '' }}
            ${{ matrix.target == 'android' && 'frontend/build/app/outputs/flutter-apk/app-release.apk' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
