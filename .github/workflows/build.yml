name: Cross-Platform Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            build_cmd: flutter build apk --release
            asset_path: frontend/build/app/outputs/flutter-apk/app-release.apk
            asset_name: KAYPOS-Android.apk
          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            asset_path: frontend/build/windows/x64/runner/Release/
            asset_name: KAYPOS-Windows.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (for Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true



      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Application
        working-directory: frontend
        run: ${{ matrix.build_cmd }}



      - name: Compress Windows App
        if: matrix.target == 'windows'
        working-directory: frontend/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath KAYPOS-Windows.zip



      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.target == 'windows' && 'frontend/build/windows/x64/runner/Release/KAYPOS-Windows.zip' || matrix.target == 'android' && 'frontend/build/app/outputs/flutter-apk/app-release.apk' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0-latest' }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
